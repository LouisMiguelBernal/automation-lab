services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Timezone used by Schedule/Cron triggers
      - GENERIC_TIMEZONE=Asia/Manila
      - TZ=Asia/Manila
      # Where n8n thinks it lives. Change to your tunnel URL when testing
      # external webhooks (Stripe) from the internet.
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_SECURE_COOKIE=false
      # Required from n8n 1.x: encrypts stored credentials. Keep it stable,
      # or every saved credential becomes unreadable.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-dev-only-change-me}
    volumes:
      # Named volume holds the SQLite DB + credentials. Survives restarts.
      - n8n_data:/home/node/.n8n
      # Drop files here to read/write them from workflow nodes.
      - ./files:/files

volumes:
  n8n_data:
